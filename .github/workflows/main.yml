name: Build UIF Win32 (single)

on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: microsoft/setup-msbuild@v2
      - run: nuget restore src/UniversalInjectorFramework.sln
      - run: msbuild src/UniversalInjectorFramework.sln /p:Configuration=winmm /p:Platform=Win32 /m
      - uses: actions/upload-artifact@v4
        with:
          name: UIF-winmm-Win32
          path: src/Build/UniversalInjectorFramework/Win32/winmm/*.dll
